name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build DMG (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            pc_arch: arm64
            kc_arch: ""
          - arch: x64
            runner: macos-14
            pc_arch: amd64
            kc_arch: "x86_64"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Caddy and Process Compose
        env:
          PC_ARCH: ${{ matrix.pc_arch }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$BUILD_ARCH" == "arm64" ]]; then
            brew install caddy
          else
            curl -L "https://caddyserver.com/api/download?os=darwin&arch=amd64" -o /usr/local/bin/caddy
            sudo chmod +x /usr/local/bin/caddy
          fi
          curl -L "https://github.com/F1bonacc1/process-compose/releases/latest/download/process-compose_darwin_${PC_ARCH}.tar.gz" -o /tmp/pc.tar.gz
          tar -xzf /tmp/pc.tar.gz -C /tmp
          sudo mv /tmp/process-compose /usr/local/bin/process-compose
          sudo chmod +x /usr/local/bin/process-compose
          caddy version
          process-compose version

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build DMG
        working-directory: desktop
        env:
          LOCAL_OPS_KEYCHAIN_ARCH: ${{ matrix.kc_arch }}
        run: |
          npm run icon
          npm run bundle
          npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Compute SHA-256
        id: checksum
        run: |
          DMG_FILE="desktop/dist/Local-Ops-$(node -p "require('./desktop/package.json').version")-${{ matrix.arch }}.dmg"
          shasum -a 256 "$DMG_FILE" | tee "checksum-${{ matrix.arch }}.txt"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: |
            desktop/dist/Local-Ops-*.dmg
            checksum-${{ matrix.arch }}.txt

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.dmg' -exec cp {} release-assets/ \;
          find artifacts -name 'checksum-*.txt' -exec cp {} release-assets/ \;
          cat release-assets/checksum-*.txt > release-assets/SHA256-SUMS.txt
          rm release-assets/checksum-*.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
